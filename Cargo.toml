[package]
name = "codename"
version = "0.2.1"
edition = "2021"
description = "A fleet of named codenames on top of the Orca desktop app CLI"
license = "MIT"
repository = "https://github.com/oldevill14/codename-fleet"
readme = "README.md"
rust-version = "1.80"

[[bin]]
name = "codename"
path = "src/main.rs"

[lib]
name = "codename"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
ureq = { version = "3", default-features = false }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
