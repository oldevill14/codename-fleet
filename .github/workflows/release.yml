name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --target x86_64-pc-windows-msvc
          rustup default stable
      - name: Test
        run: cargo test --all-targets
      - name: Build
        run: cargo build --release --target x86_64-pc-windows-msvc
      - name: Package
        shell: pwsh
        run: |
          $name = "codename-x86_64-pc-windows-msvc"
          New-Item -ItemType Directory -Force -Path dist\$name | Out-Null
          Copy-Item target\x86_64-pc-windows-msvc\release\codename.exe dist\$name\
          Copy-Item README.md, LICENSE dist\$name\
          Compress-Archive -Path dist\$name\* -DestinationPath "dist\$name.zip" -Force
          # .sha256 holds only the lowercase hex hash (install.ps1 reads the first token)
          $hash = (Get-FileHash "dist\$name.zip" -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path "dist\$name.zip.sha256" -Value $hash -NoNewline -Encoding ascii
      - name: Upload to GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) { gh release create $tag --title $tag --notes "codename $tag (alpha). Not marked prerelease on purpose: install.ps1 reads releases/latest, which skips prereleases." }
          gh release upload $tag dist\codename-x86_64-pc-windows-msvc.zip dist\codename-x86_64-pc-windows-msvc.zip.sha256 --clobber
